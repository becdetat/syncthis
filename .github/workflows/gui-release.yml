name: GUI Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gui:
    name: Build GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # electron-winstaller needs Node 22.12+; Windows also ships this node.exe in the app.
          node-version: ${{ runner.os == 'Windows' && '24' || '20' }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "tmp-pw" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "tmp-pw" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "tmp-pw" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo -n "$APPLE_API_KEY" | base64 --decode \
            > $RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Make GUI distributables
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          SYNCTHIS_RELEASE_REPO: ${{ github.repository }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.os == 'macOS' && format('{0}/AuthKey_{1}.p8', runner.temp, secrets.APPLE_API_KEY_ID) || '' }}
          # Unset until Windows signing secrets exist; the build is then unsigned.
          WINDOWS_CERTIFICATE_FILE: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_FILE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: npm run make -w packages/gui

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload assets to release
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # RELEASES has no extension; update.electronjs.org needs it, the setup exe and the full nupkg.
          # Releases must be non-draft and non-prerelease for update.electronjs.org to serve them.
          find packages/gui/out/make -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.zip" \
            -o -name "*.exe" -o -name "*-full.nupkg" -o -name "RELEASES" \) | while read -r asset; do
            name=$(basename "$asset")
            gh release delete-asset "$TAG" "$name" --yes 2>/dev/null || true
            gh release upload "$TAG" "$asset"
          done

      - name: Upload build artifacts
        if: steps.tag.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: packages/gui/out/make/**
          if-no-files-found: error
